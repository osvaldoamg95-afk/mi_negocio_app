workflows:
  android-workflow:
    name: Android Build
    environment:
      vars:
        PACKAGE_NAME: "com.tunegocio.app"
      android_signing:
        - keystore_reference
      groups:
        - google_play
      android:
        build_tools_version: "34.0.0"
        api_level: 34
    scripts:
      - ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
