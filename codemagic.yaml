workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      instance_type: mac_mini_m1
    scripts:
      - name: Install Gradle
        script: |
          brew install gradle
      - name: Build APK
        script: |
          gradle wrapper
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
